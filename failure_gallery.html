<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Individual Failure-Case Views</title><link rel="stylesheet" href="style.css"></head><body><main class="page-width gallery-page"><p><a href="index.html">← Back to project page</a></p><h1>Individual Failure-Case Camera Views</h1><p>Each event uses the same 12-second window across cameras 0–3. Labels are provisional and should be confirmed against planner logs or the original location map.</p><div id="failure-gallery"></div></main><script>
const stylesheet=document.createElement('link');stylesheet.rel='stylesheet';stylesheet.href='gallery.css';document.head.appendChild(stylesheet);
const groups=[['Physical immobilization',[1,2]],['Planner / navigation deadlock',[3,4,5]],['Goal / frontier oscillation',[6,7,8,9]],['Low-progress region',[10,11,12]]];
const slug={1:'physical_immobilization',2:'physical_immobilization',3:'planner_navigation_deadlock',4:'planner_navigation_deadlock',5:'planner_navigation_deadlock',6:'goal_frontier_oscillation',7:'goal_frontier_oscillation',8:'goal_frontier_oscillation',9:'goal_frontier_oscillation',10:'low_progress_region',11:'low_progress_region',12:'low_progress_region'};
const root=document.querySelector('#failure-gallery');for(const [title,points] of groups){const section=document.createElement('section');section.className='gallery-group';section.innerHTML=`<h2>${title}</h2>`;for(const point of points){const block=document.createElement('article');block.className='failure-block';block.innerHTML=`<h3>Failure point ${point}</h3><div class="camera-grid">${[0,1,2,3].map(camera=>`<figure><video controls muted preload="metadata" src="assets/individual_views/failure_${String(point).padStart(2,'0')}_${slug[point]}/camera${camera}.mp4"></video><figcaption>Camera ${camera}</figcaption></figure>`).join('')}</div>`;section.appendChild(block)}root.appendChild(section)}
</script></body></html>
